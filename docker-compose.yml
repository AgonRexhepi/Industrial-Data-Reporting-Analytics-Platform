services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial}
      POSTGRES_USER: ${POSTGRES_USER:-industrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industrial}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-industrial} -d ${POSTGRES_DB:-industrial}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,nginx,web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://industrial:industrial@db:5432/industrial}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - static_volume:/app/staticfiles

  worker:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,nginx,web}
      DATABASE_URL: ${DATABASE_URL:-postgresql://industrial:industrial@db:5432/industrial}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro

volumes:
  postgres_data:
  redis_data:
  static_volume:
